[package]
name = "authsvc-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "authsvc"
path = "src/main.rs"

[dependencies]
aes-gcm.workspace = true
anyhow.workspace = true
argon2.workspace = true
async-trait.workspace = true
authsvc-core = { path = "../authsvc-core" }
authsvc-idp = { path = "../authsvc-idp" }
authsvc-policy = { path = "../authsvc-policy" }
axum.workspace = true
base64.workspace = true
chrono.workspace = true
deadpool-redis.workspace = true
figment.workspace = true
hmac.workspace = true
jsonwebtoken.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
rand.workspace = true
rsa.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
totp-rs.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
webauthn-rs.workspace = true

[dev-dependencies]
reqwest = { workspace = true, features = ["json", "rustls-tls", "cookies"] }
serial_test = "3"
totp-rs = { workspace = true }
deadpool-redis.workspace = true
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres", "redis"] }
