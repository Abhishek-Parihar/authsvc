services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authsvc
      POSTGRES_PASSWORD: authsvc
      POSTGRES_DB: authsvc
    ports:
      - "5432:5432"
    volumes:
      - authsvc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authsvc"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  authsvc:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://authsvc:authsvc@postgres:5432/authsvc
      REDIS_URL: redis://redis:6379
      AUTHSVC_ISSUER: http://localhost:8080
      RUST_LOG: authsvc_server=debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  authsvc_pg:
