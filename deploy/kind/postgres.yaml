apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: authsvc
data:
  init.sql: |
    CREATE USER authsvc WITH PASSWORD 'authsvc';
    CREATE DATABASE authsvc OWNER authsvc;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: authsvc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: postgres
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: authsvc
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
