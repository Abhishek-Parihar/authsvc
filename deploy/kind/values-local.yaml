replicaCount: 1

image:
  repository: authsvc
  tag: local
  pullPolicy: Never

service:
  type: NodePort
  port: 8080
  nodePort: 30080

env:
  ENV: development
  ISSUER: "http://127.0.0.1:18080"
  PORT: "8080"
  ACCESS_TOKEN_TTL_SECS: "900"
  REFRESH_TOKEN_TTL_SECS: "604800"
  SESSION_TTL_SECS: "86400"
  POLICY_BACKEND: rbac
  RATE_LIMIT_PER_MINUTE: "100000"

secrets:
  databaseUrl: "postgres://authsvc:authsvc@postgres:5432/authsvc"
  redisUrl: "redis://redis:6379"
  bootstrapSecret: "perf-bootstrap-k8s"
  mfaEncryptionKey: "dev-mfa-key-change-me"

resources:
  limits:
    cpu: "2"
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi
