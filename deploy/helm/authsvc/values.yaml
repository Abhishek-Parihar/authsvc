replicaCount: 3

image:
  repository: authsvc
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  nodePort: 30080

ingress:
  enabled: false
  className: ""
  host: authsvc.local
  tls: false
  tlsSecret: authsvc-tls
  annotations: {}

env:
  ENV: production
  PORT: "8080"
  ISSUER: "https://authsvc.example.com"
  JWT_KEY_GRACE_SECS: "86400"
  ACCESS_TOKEN_TTL_SECS: "900"
  REFRESH_TOKEN_TTL_SECS: "604800"
  SESSION_TTL_SECS: "86400"
  POLICY_BACKEND: rbac
  DATABASE_MAX_CONNECTIONS: "25"
  DISABLE_PASSWORD_GRANT: "true"
  # Optional integrations (leave empty to disable)
  JWT_KMS_HTTP_URL: ""
  JWT_KMS_KEY_ID: ""
  KMS_HTTP_URL: ""
  OTEL_ENDPOINT: ""
  AUDIT_EXPORT_WEBHOOK: ""
  ALLOWED_ORIGINS: "https://app.example.com"
  MIGRATE_ON_START: "false"
  DATABASE_READ_URL: ""
  WEBAUTHN_RP_ID: ""
  AUDIT_RETENTION_DAYS: "365"
  DSAR_ARTIFACT_RETENTION_DAYS: "30"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

migration:
  enabled: true

secrets:
  databaseUrl: "postgres://authsvc:authsvc@postgres:5432/authsvc"
  databaseMigratorUrl: ""
  redisUrl: "redis://redis:6379"
  jwtPrivateKeyPem: ""
  jwtPublicKeyPem: ""
  bootstrapSecret: ""
  mfaEncryptionKey: ""
  dataEncryptionKey: ""
  metricsBearerToken: ""

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

livenessProbe:
  path: /health
  port: 8080
  initialDelaySeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  path: /ready
  port: 8080
  initialDelaySeconds: 5
  timeoutSeconds: 5
  failureThreshold: 3
