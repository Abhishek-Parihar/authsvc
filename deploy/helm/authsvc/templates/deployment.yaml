apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "authsvc.fullname" . }}
  labels:
    app.kubernetes.io/name: authsvc
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: authsvc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authsvc
    spec:
      containers:
        - name: authsvc
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "authsvc.fullname" . }}
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "authsvc.fullname" . }}
                  key: redis-url
            {{- if .Values.secrets.jwtPrivateKeyPem }}
            - name: JWT_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: {{ include "authsvc.fullname" . }}
                  key: jwt-private-key-pem
            {{- end }}
            {{- if .Values.secrets.jwtPublicKeyPem }}
            - name: JWT_PUBLIC_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: {{ include "authsvc.fullname" . }}
                  key: jwt-public-key-pem
            {{- end }}
            {{- if .Values.secrets.bootstrapSecret }}
            - name: BOOTSTRAP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "authsvc.fullname" . }}
                  key: bootstrap-secret
            {{- end }}
            {{- if .Values.secrets.mfaEncryptionKey }}
            - name: MFA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "authsvc.fullname" . }}
                  key: mfa-encryption-key
            {{- end }}
            - name: ENV
              value: {{ .Values.env.ENV | quote }}
            - name: ISSUER
              value: {{ .Values.env.ISSUER | default .Values.env.AUTHSVC_ISSUER | quote }}
            - name: POLICY_BACKEND
              value: {{ .Values.env.POLICY_BACKEND | quote }}
            {{- if .Values.env.JWT_KEY_GRACE_SECS }}
            - name: JWT_KEY_GRACE_SECS
              value: {{ .Values.env.JWT_KEY_GRACE_SECS | quote }}
            {{- end }}
            {{- if .Values.env.RATE_LIMIT_PER_MINUTE }}
            - name: RATE_LIMIT_PER_MINUTE
              value: {{ .Values.env.RATE_LIMIT_PER_MINUTE | quote }}
            {{- end }}
            - name: PORT
              value: {{ .Values.env.PORT | default .Values.env.AUTHSVC_PORT | default "8080" | quote }}
            - name: HOST
              value: "0.0.0.0"
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: {{ .Values.livenessProbe.port }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: {{ .Values.readinessProbe.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
